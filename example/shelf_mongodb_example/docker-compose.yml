# Single-node replica set (required for MongoDB transactions).
# Auth is omitted: replSet + auth would require a keyfile.
services:
  mongo:
    image: mongo:7
    container_name: anaki_mongo
    restart: unless-stopped
    command: ['--replSet', 'rs0', '--bind_ip_all']
    ports:
      - '27017:27017'
    healthcheck:
      test: >
        mongosh --quiet --eval
        "try { rs.status().ok } catch (e) {
           rs.initiate({_id: 'rs0', members: [{_id: 0, host: 'localhost:27017'}]}).ok
         }"
      interval: 5s
      timeout: 30s
      retries: 30
    volumes:
      - mongodata:/data/db

volumes:
  mongodata:
