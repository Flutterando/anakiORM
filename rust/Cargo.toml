[package]
name = "anaki_native"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[features]
default = []
sqlite = ["dep:sqlx", "sqlx/sqlite"]
postgres = ["dep:sqlx", "sqlx/postgres"]
mysql = ["dep:sqlx", "sqlx/mysql"]
mssql = ["dep:tiberius", "tiberius/chrono", "tiberius/rust_decimal", "dep:tokio-util", "dep:chrono", "dep:rust_decimal"]
oracle = ["dep:sibyl"]
redis = ["dep:redis"]
mongodb = ["dep:mongodb", "dep:futures-util"]

[dependencies]
# "net" is required directly: mssql uses tokio::net::TcpStream and the async
# drivers need the IO reactor even when sqlx (which used to pull it in) is absent.
tokio = { version = "1", features = ["rt-multi-thread", "net"] }
serde = { version = "1", features = ["derive"] }
# preserve_order: rows must keep SELECT column order (serde_json::Map is
# otherwise a BTreeMap that sorts keys alphabetically)
serde_json = { version = "1", features = ["preserve_order"] }
async-trait = "0.1"

# sqlx — shared across sqlite, postgres, mysql.
# chrono/rust_decimal/uuid: without these, timestamptz/decimal/uuid columns
# fail to decode and were silently returned as NULL.
sqlx = { version = "0.8", features = ["runtime-tokio", "tls-rustls", "chrono", "rust_decimal", "uuid"], optional = true }

# mssql (SQL Server)
tiberius = { version = "0.12", default-features = false, features = ["rustls", "tds73"], optional = true }
tokio-util = { version = "0.7", features = ["compat"], optional = true }
chrono = { version = "0.4", optional = true }
rust_decimal = { version = "1", optional = true }

# oracle
sibyl = { version = "0.6", optional = true }

# redis (no TLS in v1; pure Rust, zigbuild-safe)
redis = { version = "0.32", features = ["tokio-comp", "connection-manager"], optional = true }

# mongodb (default features: rustls-tls + dns-resolver; never enable
# compression/openssl/in-use-encryption — they break cargo-zigbuild)
mongodb = { version = "3", optional = true }
futures-util = { version = "0.3", optional = true }

[profile.release]
lto = true
strip = true
opt-level = "z"
codegen-units = 1
